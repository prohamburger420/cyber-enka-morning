# 本番: 朝の番組を作ってR2へ置く（2026-09-05）
#
# パスA = 本編（放送前に作る）/ パスB = おたより（放送中、曲1が流れている間に作る）
# いまは手動起動のみ。★放送時刻が未確定なので schedule はまだ入れない。
name: morning
on:
  # ★★パスAだけ自動起動する（2026-09-05 放送時刻が6/7/8時に確定）。
  #   放送は6時・7時・8時の3回。同じ本編を3回流し、おたより(パスB)だけ各回で作り直す。
  #   パスAは 20:10 UTC = **朝5時10分（日本時間）** に起動。
  #   実測でパスA全体が14分前後なので、6時の放送まで35分以上の余裕がある。
  #
  #   ⚠★★パスBは cron で組めない。GitHub公式が明記している:
  #     「schedule イベントは高負荷時に遅延する。**高負荷の時間帯には毎時0分が含まれる**。
  #       負荷が十分高い場合、**キューされたジョブが破棄されることがある**」
  #     放送は毎時0分ちょうど＝一番混む時刻。そこに一番シビアな処理は置けない。
  #     （曲1が流れている数分の間に間に合わせる必要がある）
  #   → パスBの起動方法は別途決める。候補: VPS側から時刻を見て
  #     workflow_dispatch を叩く（cronの遅延を受けない）。**未決。**
  #
  #   ⚠ 5時10分を選んだのは、毎時0分の混雑を外すため。0分ちょうどにしない。
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      pass:
        description: "a=本編 / b=おたより"
        required: true
        default: "a"
        type: choice
        options: ["a", "b"]
      no_audio:
        description: "台本だけ作る（音声を作らない）"
        type: boolean
        default: false
      warm_wait:
        description: "パスB専用。準備を終えたあと、ここで指定した秒数だけ待ってから生成する"
        required: false
        default: "0"
      hour:
        description: "パスB専用。何時の回か（6/7/8）。その回のM3Uだけ書き直す"
        required: false
        default: "6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ★★cron起動では inputs が空になる（workflow_dispatch の入力は渡らない）。
      #   そのまま inputs.pass を使うと `--pass ` が引数なしになり、
      #   `if: inputs.pass == 'a'` も偽になって「その日のフォルダを空にする」が飛ぶ。
      #   → 空なら既定値に倒す形に統一する。**自動起動は必ずパスA。**
      PASS: ${{ inputs.pass || 'a' }}
      WARM_WAIT: ${{ inputs.warm_wait || '0' }}
      HOUR: ${{ inputs.hour || '6' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GSV_DIR: ${{ github.workspace }}/gsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: GPT-SoVITS を取得（固定コミット）
        run: |
          git clone --depth 1 https://github.com/RVC-Boss/GPT-SoVITS.git gsv
          cd gsv && git fetch --depth 1 origin d523079fc05d9a8028d6085bffe4a2757c32abb6
          git checkout d523079fc05d9a8028d6085bffe4a2757c32abb6

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-gsv-d523079

      - name: 依存を入れる
        run: |
          # ★版はローカルの動作確認済みに固定する。torchaudio を上げると
          #   torchaudio.load が TorchCodec を要求して落ちる（2026-09-05 実測）
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE 'onnxruntime-gpu|^torchaudio' gsv/requirements.txt > req.txt
          pip install -q -r req.txt
          # ⚠★★yt-dlp を忘れていた（2026-09-06 発覚）。chat_collect.py は
          #   「いま配信中の動画ID」を **yt-dlpのCLI** で引く。入っていないので
          #   FileNotFoundError → 握りつぶし → 「配信中の動画が見つからない」。
          #   ＝**おたよりは本番で一度も取れていなかった。**
          pip install -q boto3 anthropic pytchat yt-dlp 'numpy==1.26.4' 'transformers==4.50.0' 'soundfile==0.14.0'
          # ★ffmpegと同じ轍を踏まないよう、**入ったことをここで確かめる**。
          #   （`|` を使わない。パイプの終了コードは右側のものになる）
          command -v yt-dlp

      # ★★BGMのミックスに ffmpeg/ffprobe が要る（2026-09-05 実測）。
      #   ⚠ **ubuntu-latest には入っていない。** 「入っているはず」で書いて落ちた。
      #   ⚠★ しかも最初に置いたガードが `ffmpeg -version | head -1` だったため、
      #     **パイプの終了コードは head のもの＝ffmpegが無くても成功**していた。
      #     ＝「測定系が生きているか」を確かめずに測っていた。ガードは
      #     **無い時に本当に落ちること**を確かめてから置く。
      #   ★ここに置くのは、パスBの待機(WARM_WAIT)より**手前**にするため。
      #     後ろに置くと、放送が始まってからaptを叩くことになる。
      - name: ffmpeg を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && command -v ffprobe

      # ★★英語g2pが使うNLTKの辞書を先に落とす（2026-09-05 実測で news が2回落ちた）。
      #   台本に**英字が混じると英語のg2p(g2p_en)が走り**、NLTKの品詞タガーを要求する。
      #   今日は電脳芸能ニュースに「HOT LIMIT」「T.M.Revolution」が入って踏んだ。
      #   ⚠ GPT-SoVITSが自動で落とすのは**旧名の `averaged_perceptron_tagger`** だが、
      #     新しいNLTKは **`averaged_perceptron_tagger_eng`** を探すので見つからない。
      #   ★これは「その日の台本に英字が入ったときだけ落ちる」＝**日によって出たり出なかったり**する。
      #     以前 news だけが落ちて 6/7ブロックが納品された件も、ほぼ同じ原因のはず。
      - name: 英語g2pの辞書を落とす
        run: |
          python - <<'EOF'
          import nltk
          for r in ("averaged_perceptron_tagger_eng", "averaged_perceptron_tagger",
                    "cmudict", "punkt_tab"):
              ok = nltk.download(r, quiet=True)
              print(("OK  " if ok else "NG  ") + r)
          EOF

      - uses: actions/cache@v4
        id: models
        with:
          path: |
            gsv/GPT_SoVITS/pretrained_models
            assets
          # ★assets は毎回引くので、ここを手で上げる必要はもう無い。
          #   （以前は上げ忘れると古い辞書・古いBGMのまま走った）
          key: r2-models-v3

      # 共通モデル(1.3GB)はキャッシュが当たれば引かない
      - name: 共通モデルを取ってくる
        if: steps.models.outputs.cache-hit != 'true'
        run: python infra/r2.py pull runtime/pretrained_models gsv/GPT_SoVITS/pretrained_models

      # ★★番組の資産は**毎回引く**（2026-09-05）。
      #   ⚠ 以前はキャッシュが当たると丸ごと飛ばしていたので、
      #     **読みの辞書やBGMを差し替えても本番には届かなかった**。
      #     キーを手で上げる運用は必ず忘れる（実際に忘れかけた）。
      #   ★r2.py pull は**中身が同じものは落とさない**（ETag照合）ので、
      #     毎回引いても実際に流れるのは変わったファイルだけ。
      #     キャッシュはダウンロード量の削減として効いたまま。
      - name: 番組の資産を取ってくる（差分だけ流れる）
        run: python infra/r2.py pull assets assets

      # ★★これを忘れると番組名と名前のアクセントが元に戻る。
      #   「サイバー演歌モーニング」「らいおんこずえ」の抑揚は
      #   GPT-SoVITSのユーザー辞書で作っている（2026-09-04 耳判定で確定）。
      - name: 読み・アクセントの辞書を適用
        run: python voice/apply_userdict.py

      # ★ニュースの「前に読んだ」台帳。実行のたびにコンテナが消えるので、
      #   R2に置いて引き継ぐ。無くても番組は動く（同じ話題を読む確率が上がるだけ）ので
      #   落としても止めない。
      - name: ニュース台帳を取ってくる
        continue-on-error: true
        run: python infra/r2.py pull state state

      # ★★パスBは**パスAの成果物を取ってこないと動かない**（2026-09-06 発覚）。
      #   パスAとパスBは**別のランナー**で走る。パスBのランナーには out/ が空なので:
      #     - datapack.json が無い → 読み込みで落ちる
      #     - 本編7ブロックが無い → M3Uが「欠けている」と判断されて書かれない
      #   ＝おたよりを作っても**放送に乗らない**。
      #   ⚠ パスBの起動方法が未決だったため、**一度も本番で走っていなかった**。
      #     走らせていれば初回で落ちて分かったはず。
      - name: パスAの成果物を取ってくる（パスBのみ）
        if: env.PASS == 'b'
        run: |
          D=out/$(TZ=Asia/Tokyo date +%F)
          python infra/r2.py pull "$D" "$D"
          ls -la "$D"

      # ★★これがパスBの生命線（2026-09-05 実測から）。
      #   パスBは「曲1が流れている4〜5分の間におたよりを作る」設計だが、
      #   実測を積むと **LLMの時間を0と仮定しても間に合わない**:
      #     セットアップ135秒＋モデル読込20秒＋合成130秒＋納品24秒 = 309秒
      #     締切は 曲1(280秒)＋交通/SA(22秒) = 302秒
      #   ∴ **セットアップを放送時間の外に追い出すしかない。**
      #   パスBを放送の数分前に起動し、準備を全部済ませた状態でここで待つ。
      #   待っている間に曲1が流れ、チャットが集まる。待ち明けは生成だけ＝150秒前後。
      #   ⚠ 公開リポジトリなら実行時間は無制限なので、待たせるコストはゼロ。
      # ★★待ち時間はそのままチャット収集に使う。
      #   ⚠⚠ これを入れるまで **chat_collect.py はActions上で一度も走っていなかった**
      #     （2026-09-05 発覚）。load_chat が読む chat_live.json を誰も書かないので、
      #     本番は常に fake_chat.json（試作用の作り物）に倒れていた。
      #     ＝「自分が聴いてる回で自分のおたよりが読まれる」というパスBの存在理由が
      #     機能していなかった。**静かに壊れていた**ので、緑のまま気づけなかった。
      #   ★落ちても番組は止めない。0件なら「おたよりゼロの回」として進む。
      - name: 放送を待ちながらチャットを集める
        if: env.PASS == 'b' && env.WARM_WAIT != '0'
        continue-on-error: true
        run: |
          D=out/$(TZ=Asia/Tokyo date +%F)
          mkdir -p "$D"
          echo "準備完了。${WARM_WAIT}秒かけてチャットを集める → $D/chat_live.json"
          # ★★失敗を**実行サマリの先頭に出す**（2026-09-06）。
          #   continue-on-error は「番組を止めない」ために要る。だが緑のまま
          #   埋もれると、**おたよりが一度も取れていないことに気づけない**（実際に起きた）。
          #   ::warning:: はGitHubのUIで run のページ最上部に出る。
          python v2/chat_collect.py --seconds "$WARM_WAIT" --out "$D/chat_live.json" \
            || { echo "::warning title=チャット取得に失敗::おたよりはフォールバック版になります"; exit 1; }

      - name: 台本と音声を作る
        run: |
          python -m runner.build --pass "$PASS" --hour "$HOUR" ${{ inputs.no_audio && '--no-audio' || '' }}

      # ★台帳の書き戻しは納品より先。ここが落ちても納品は済ませたい…わけではなく、
      #   逆に「読んだのに記録が残らない」と翌朝また同じ話題を読む。だから先に確実に戻す。
      - name: ニュース台帳を書き戻す
        if: always()
        continue-on-error: true
        run: python infra/r2.py push state state

      # ★★パスAは「その日の始まり」なので、納品前にその日のフォルダを空にする。
      #   （2026-09-05 実際に起きた）構成の違う古い回のブロックが同じ日付フォルダに
      #   残り、今日の回と混ざった。VPSは out/ を丸ごとコピーするので、
      #   **RadioDJに別の回のブロックが流れる**。しかも「エンディングだけ古いものが残る」
      #   ので一見そろって見える。prune は7日より古いものしか消さないので拾えない。
      #   ⚠ パスBでは絶対に呼ばない（パスAが作ったものを消してしまう）。
      - name: この日のフォルダを空にする（パスAのみ）
        if: env.PASS == 'a'
        run: python infra/r2.py clear "out/$(TZ=Asia/Tokyo date +%F)"

      - name: R2へ納品
        run: |
          python infra/r2.py push out out
          python infra/r2.py prune out --days 7

      - name: 結果を持ち帰る
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ inputs.pass || 'a' }}
          path: out/
          if-no-files-found: error
